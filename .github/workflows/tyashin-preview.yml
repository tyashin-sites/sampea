name: Tyashin preview
on:
  push:
    branches: ['tyashin/edit-*']

concurrency:
  group: tyashin-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Fetch build-time env from Tyashin
        run: |
          SECRETS_JSON=$(curl -sS "${{ secrets.TYASHIN_API_URL }}/api/v1/builds/secrets/${{ github.repository }}" \
            -H "X-Build-Secret: ${{ secrets.TYASHIN_BUILD_SECRET }}")
          echo "$SECRETS_JSON" | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            if (!data.success || !data.data) process.exit(0);
            const fs = require('fs');
            for (const [key, val] of Object.entries(data.data)) {
              const v = String(val ?? '');
              fs.appendFileSync(process.env.GITHUB_ENV, key + '<<__TYASHIN_EOF__\n' + v + '\n__TYASHIN_EOF__\n');
              console.log('::add-mask::' + v);
            }
          "

      - name: Build with OpenNext
        run: npx @opennextjs/cloudflare build

      # Cloudflare gives NO preview URLs to a Worker that implements a Durable
      # Object, and every OpenNext site does (DOQueueHandler, the ISR queue).
      # So a preview-alias version upload uploaded fine and never returned a
      # URL (proved on tyashin-sites/sampea, 2026-11-09). Instead the branch is
      # deployed as its OWN Worker, e-<id>-<script>, on workers.dev only: the
      # config copy in this checkout drops routes and points the self-reference
      # at the preview Worker; nothing is committed. The platform deletes the
      # preview Worker on publish or discard (preview.ts).
      - name: Deploy preview Worker (no live traffic)
        id: preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TYASHIN_API_URL: ${{ secrets.TYASHIN_API_URL }}
          TYASHIN_BUILD_SECRET: ${{ secrets.TYASHIN_BUILD_SECRET }}
        run: |
          ALIAS="e-${GITHUB_REF_NAME#tyashin/edit-}"
          SECRETS_FILE="$RUNNER_TEMP/preview-secrets.json"
          curl -sS "$TYASHIN_API_URL/api/v1/builds/secrets/$GITHUB_REPOSITORY" \
            -H "X-Build-Secret: $TYASHIN_BUILD_SECRET" -o "$RUNNER_TEMP/secrets-response.json"
          export ALIAS SECRETS_FILE
          NAME=$(node <<'__TYASHIN_JS__'
          const fs = require('fs');
          const res = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/secrets-response.json', 'utf8') || '{}');
          const secrets = {};
          for (const [k, v] of Object.entries((res && res.success && res.data) || {})) secrets[k] = String(v ?? '');
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify(secrets), { mode: 0o600 });
          const file = ['wrangler.jsonc', 'wrangler.json'].find((f) => fs.existsSync(f));
          if (!file) { console.error('No wrangler.jsonc in the repo'); process.exit(1); }
          const raw = fs.readFileSync(file, 'utf8');
          let cfg;
          try { cfg = JSON.parse(raw); } catch {
            cfg = JSON.parse(raw.replace(/^\s*\/\/.*$/gm, '').replace(/,(\s*[}\]])/g, '$1'));
          }
          const live = cfg.name;
          const name = process.env.ALIAS + '-' + live;
          if (name.length > 63) { console.error('Preview Worker name too long: ' + name); process.exit(1); }
          cfg.name = name;
          cfg.workers_dev = true;
          delete cfg.preview_urls;
          delete cfg.routes;
          delete cfg.route;
          for (const s of cfg.services || []) if (s.service === live) s.service = name;
          fs.writeFileSync(file, JSON.stringify(cfg, null, 2));
          process.stdout.write(name);
          __TYASHIN_JS__
          )
          OUT=$(npx wrangler deploy --secrets-file "$SECRETS_FILE" 2>&1) || { rm -f "$SECRETS_FILE"; echo "$OUT"; exit 1; }
          rm -f "$SECRETS_FILE" "$RUNNER_TEMP/secrets-response.json"
          echo "$OUT"
          URL=$(echo "$OUT" | grep -oE "https://$NAME\.[a-z0-9-]+\.workers\.dev" | head -1)
          if [ -z "$URL" ]; then
            echo "::error::The preview Worker $NAME deployed but wrangler printed no workers.dev URL."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Notify Tyashin (preview ready)
        if: success()
        run: |
          curl -sS -X POST "${{ secrets.TYASHIN_API_URL }}/api/v1/builds/webhook" \
            -H "Content-Type: application/json" \
            -H "X-Build-Secret: ${{ secrets.TYASHIN_BUILD_SECRET }}" \
            -d '{
              "kind": "preview",
              "repo": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit_sha": "${{ github.sha }}",
              "status": "success",
              "preview_url": "${{ steps.preview.outputs.url }}",
              "run_id": "${{ github.run_id }}"
            }'

      - name: Notify Tyashin (preview failed)
        if: failure()
        run: |
          curl -sS -X POST "${{ secrets.TYASHIN_API_URL }}/api/v1/builds/webhook" \
            -H "Content-Type: application/json" \
            -H "X-Build-Secret: ${{ secrets.TYASHIN_BUILD_SECRET }}" \
            -d '{
              "kind": "preview",
              "repo": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit_sha": "${{ github.sha }}",
              "status": "failed",
              "run_id": "${{ github.run_id }}"
            }'
